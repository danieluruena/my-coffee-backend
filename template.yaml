AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Mi Cafecito backend foundation

Parameters:
  ProjectName:
    Type: String
    Default: mi-cafecito
  Env:
    Type: String
    Default: dev
    Description: Deployment environment name.
    AllowedValues:
      - local
      - dev
      - prod
  ApiStageName:
    Type: String
    Default: $default
    Description: HTTP API stage name.
  CognitoUserPoolId:
    Type: String
    Default: ""
  CognitoClientId:
    Type: String
    Default: ""

Conditions:
  IsDefaultApiStage: !Equals [!Ref ApiStageName, $default]

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        PROJECT_NAME: !Ref ProjectName
        ENVIRONMENT: !Ref Env
        TABLE_NAME: !Sub "${ProjectName}-${Env}"
        BUCKET_NAME: !Sub "${ProjectName}-${Env}"
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId
    Tags:
      Project: !Ref ProjectName
      Environment: !Ref Env

Resources:
  CoffeeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${ProjectName}-${Env}"
      StageName: !Ref ApiStageName
      Auth:
        Authorizers:
          RequestAuthorizer:
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            FunctionArn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-authorizer-${Env}"
            Identity:
              Headers:
                - Authorization
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Env

  CoffeeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Env

  CoffeeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Env}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Env

  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/shared/functions/health/index.ts
        Minify: false
        Sourcemap: true
        Target: es2022
    Properties:
      FunctionName: !Sub "${ProjectName}-health-${Env}"
      CodeUri: .
      Handler: src/shared/functions/health/index.handler
      Runtime: nodejs24.x
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref CoffeeApi
            Path: /health
            Method: GET
            PayloadFormatVersion: "2.0"

  CreateUserProfileFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/user/functions/createUserProfile/index.ts
        Minify: false
        Sourcemap: true
        Target: es2022
    Properties:
      FunctionName: !Sub "${ProjectName}-user-profile-${Env}"
      CodeUri: .
      Handler: src/user/functions/createUserProfile/index.handler
      Runtime: nodejs24.x
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CoffeeTable
      Events:
        CreateUserProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref CoffeeApi
            Path: /user/profile
            Method: POST
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: RequestAuthorizer
              AuthorizationType: CUSTOM

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/auth/functions/authorizer/index.ts
        Minify: false
        Sourcemap: true
        Target: es2022
    Properties:
      FunctionName: !Sub "${ProjectName}-authorizer-${Env}"
      CodeUri: .
      Handler: src/auth/functions/authorizer/index.handler
      Runtime: nodejs24.x

Outputs:
  ApiBaseUrl:
    Description: Base URL of the HTTP API.
    Value: !If
      - IsDefaultApiStage
      - !Sub https://${CoffeeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
      - !Sub https://${CoffeeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}
  HealthApiUrl:
    Description: URL of the health endpoint
    Value: !If
      - IsDefaultApiStage
      - !Sub https://${CoffeeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/health
      - !Sub https://${CoffeeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}/health
  CoffeeTableName:
    Description: Name of the DynamoDB table used by the backend.
    Value: !Ref CoffeeTable
  CoffeeBucketName:
    Description: Name of the private S3 bucket used for coffee photos.
    Value: !Ref CoffeeBucket
